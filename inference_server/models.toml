# Catalogue of supported models. `download.py` and `serve.py` look up entries
# by their key (e.g. `python download.py qwen2.5-14b`).
#
# `repo` is the HuggingFace repo, `file` is the GGUF filename inside it.
# Both Q4_K_M variants comfortably fit on a 32 GB VRAM card and match the
# spec's candidate list.

[models."qwen2.5-14b"]
repo = "bartowski/Qwen2.5-14B-Instruct-GGUF"
file = "Qwen2.5-14B-Instruct-Q4_K_M.gguf"
context = 8192
chat_format = "chatml"

[models."mistral-small-24b"]
repo = "bartowski/Mistral-Small-24B-Instruct-2501-GGUF"
file = "Mistral-Small-24B-Instruct-2501-Q4_K_M.gguf"
context = 8192
chat_format = "mistral-instruct"

# Light fallback for laptops / quick tests (~4 GB RAM, CPU-friendly).
[models."qwen2.5-3b"]
repo = "bartowski/Qwen2.5-3B-Instruct-GGUF"
file = "Qwen2.5-3B-Instruct-Q4_K_M.gguf"
context = 8192
chat_format = "chatml"
