<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UNIMATRIX</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --ink:#d7dde6;
    --dim:#8b97a7; --line:#2a313c; --accent:#7aa2f7; --good:#7ee787;
    --warn:#e0a458; --bad:#f7768e; --cyan:#56d4dd; --mag:#c792ea; --blue:#1f77b4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
    border-bottom:1px solid var(--line);padding:10px 18px}
  .hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12px}
  select,button,input{background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px}
  button{cursor:pointer}
  button:hover,select:hover{border-color:var(--accent)}
  button.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
  button.danger{border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;
    border-radius:999px;font-size:12px;border:1px solid var(--line)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.live{background:var(--good);box-shadow:0 0 6px var(--good)}
  .dot.paused{background:var(--warn)} .dot.past{background:var(--cyan)}
  .grow{flex:1}
  .tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
  .tab{padding:6px 13px;border-radius:8px 8px 0 0;background:transparent;
    border:1px solid transparent;color:var(--dim);cursor:pointer;font-size:13px}
  .tab.active{background:var(--panel);color:var(--ink);
    border-color:var(--line);border-bottom-color:var(--panel)}
  main{padding:16px 18px 70px}
  .grid{display:grid;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card h3{margin:0 0 10px;font-size:12px;color:var(--accent);
    text-transform:uppercase;letter-spacing:.5px;font-weight:650}
  .muted{color:var(--dim)} .small{font-size:12px}
  .alive{color:var(--good)} .dead{color:var(--bad)} .key{color:var(--cyan)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:6px 11px;min-width:84px}
  .chip b{font-size:18px;display:block} .chip span{font-size:11px;color:var(--dim)}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
    border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:4px}
  .bar>span{display:block;height:100%;background:var(--good)}
  .scroll{max-height:62vh;overflow:auto}
  .feed{max-height:280px;overflow:auto;font-size:12.5px}
  .feed div{padding:3px 0;border-bottom:1px solid var(--line)}
  .tl{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}
  .tl .node{position:relative;margin-bottom:14px}
  .tl .node::before{content:'';position:absolute;left:-23px;top:4px;width:10px;
    height:10px;border-radius:50%;background:var(--accent)}
  .diff{color:var(--warn);font-size:12px}
  .agent-item{cursor:pointer} .agent-item:hover{background:var(--panel2)}
  .two{grid-template-columns:300px 1fr;align-items:start}
  .empty{color:var(--dim);padding:18px;text-align:center}
  .charts{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  svg.chart{width:100%;height:160px;display:block}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-top:4px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;z-index:10}
  .toast.show{opacity:1}
  .spinner{width:15px;height:15px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;
    display:inline-block;vertical-align:middle;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>UNIMATRIX</h1><span class="sub">a society of self-constructing AI Agents</span>
    <span id="status" class="pill"><span class="dot"></span><span id="statusText">…</span></span>
    <span class="grow"></span>
    <label class="sub">run</label>
    <select id="runSel" style="max-width:280px"></select>
    <button id="refresh" title="refresh">&#x21bb;</button>
  </div>
  <div class="hrow" style="margin-top:8px">
    <div id="controls" class="ctrls"></div>
    <span class="grow"></span>
    <input id="bcast" placeholder="speak to all beings…" style="width:240px" disabled />
    <button id="bcastBtn" disabled>broadcast</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="view"><div class="empty">loading…</div></main>
<div class="toast" id="toast"></div>

<script>
const TABS=[["overview","Overview"],["beings","Beings"],["self","Self-evolution"],
  ["meaning","Meaning & Belief"],["labor","Labor & Purpose"],
  ["kinship","Kinship & Intimacy"],["continuity","Mortality & Continuity"]];

let live={running:false}, runs=[], configs=[], target=null, tab="overview";
let data={}, selfAgent=null, pollTimer=null, busy=null;

const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;
  if(h!==undefined)e.innerHTML=h;return e;};
const esc=s=>(s==null?"":String(s)).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const nm=(id,names)=>esc(names&&names[id]?names[id]:id);
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error((await r.text()).slice(0,200)||r.status);
  const t=await r.text();return t?JSON.parse(t):{};}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);}

const isLiveTarget=()=>live.running&&target===live.run_id;

// ---------- top-level load ----------
async function loadState(){ try{ live=await j("/state"); }catch(e){ live={running:false}; }
  configs=live.configs||configs;
  if(!configs.length){ try{ configs=(await j("/configs")).configs||[]; }catch(e){} } }
async function loadRuns(){ try{ runs=await j("/runs"); }catch(e){ runs=[]; } }

function pickTarget(){
  if(live.running && target===null) target=live.run_id;
  if(target===null && runs.length) target=runs[0].id;
}

async function boot(){
  await Promise.all([loadState(),loadRuns()]);
  pickTarget();
  renderShell();
  await loadData();
  render();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(tickPoll,2500);
}

async function tickPoll(){
  await loadState(); await loadRuns();
  if(live.running && target===null) target=live.run_id;
  renderShell();
  if(isLiveTarget()){ await loadData(); render(); }
}

async function loadData(){
  if(target===null){ data={}; return; }
  const base=`/runs/${target}`;
  try{
    const [beings,meaning,labor,kinship,continuity,timeline]=await Promise.all([
      j(base+"/beings"),j(base+"/meaning"),j(base+"/labor"),
      j(base+"/kinship"),j(base+"/continuity"),j(base+"/timeline")]);
    data={agents:beings.beings||[],meaning,labor:labor.projects||[],
      kinship,continuity,timeline};
  }catch(e){ data={error:e.message}; }
}

// ---------- derived stats ----------
function stats(){
  const a=data.agents||[], tl=data.timeline||{};
  const living=a.filter(x=>x.alive).length;
  const maxTick=Math.max(live.tick_no||0,
    ...(tl.self_revisions||[]),...(tl.deaths||[]),...(tl.births||[]),
    ...(tl.artifacts||[]),...(tl.projects_started||[]),0);
  return {
    tick: isLiveTarget()?(live.tick_no||0):maxTick,
    living, dead:(data.continuity?.deaths||[]).length, beings:a.length,
    self_revisions:(tl.self_revisions||[]).length,
    artifacts:(data.meaning?.artifacts||[]).length,
    adoptions:(data.meaning?.adoptions||[]).length,
    projects_started:(data.labor||[]).length,
    projects_completed:(data.labor||[]).filter(p=>p.status==="completed").length,
    bonds:(data.kinship?.relationships||[]).filter(r=>r.dissolved_tick==null).length,
    groups:(data.kinship?.groups||[]).length,
    births:(data.continuity?.lineage||[]).length,
    messages: isLiveTarget()?(live.metrics?.messages_sent):null,
  };
}

// ---------- shell (status + controls + tabs) ----------
function renderShell(){
  const st=$("#status"), dot=st.querySelector(".dot"), txt=$("#statusText");
  dot.className="dot"+(live.running?(live.paused?" paused":" live"):(target!=null?" past":""));
  if(live.running) txt.textContent=`LIVE · tick ${live.tick_no} · ${live.metrics?.living??"?"} alive`
    +(live.paused?" · paused":"");
  else if(target!=null) txt.textContent="viewing past run";
  else txt.textContent="idle";

  const sel=$("#runSel");
  sel.innerHTML="";
  runs.forEach(r=>{const o=el("option");o.value=r.id;
    const badge=(live.running&&r.id===live.run_id)?" ● LIVE":"";
    o.textContent=`#${r.id} ${r.name} [${r.status}]${badge}`;sel.appendChild(o);});
  if(target!=null) sel.value=target;

  const c=$("#controls"); c.innerHTML="";
  if(busy){
    c.appendChild(el("span","spinner"));
    c.appendChild(el("span","sub",busy));
  } else if(!live.running){
    const cs=el("select"); cs.id="startCfg";
    configs.forEach(cf=>{const o=el("option");o.value=cf.file;
      o.textContent=`${cf.simulation_name||cf.file} (${cf.agents||0})`;cs.appendChild(o);});
    c.appendChild(el("span","sub","start:")); c.appendChild(cs);
    const b=el("button","primary","start"); b.onclick=()=>ctl("start"); c.appendChild(b);
  } else {
    const pb=el("button",null,live.paused?"resume":"pause");
    pb.onclick=()=>ctl(live.paused?"resume":"pause"); c.appendChild(pb);
    const ck=el("button",null,"checkpoint"); ck.onclick=()=>ctl("checkpoint"); c.appendChild(ck);
    const sb=el("button","danger","stop"); sb.onclick=()=>ctl("stop"); c.appendChild(sb);
  }
  if(!busy && target!=null && !(live.running&&target===live.run_id)){
    const tr=runs.find(r=>r.id===target);
    if(!live.running && tr && (tr.status==="paused"||tr.status==="running")){
      const rb=el("button",null,"resume run"); rb.onclick=()=>ctl("resumeRun"); c.appendChild(rb);
      const eb=el("button","danger","end"); eb.onclick=()=>ctl("endRun"); c.appendChild(eb);
    }
    if(!live.running){ const db=el("button","danger","delete");
      db.onclick=()=>ctl("delete"); c.appendChild(db); }
  }
  const canB=live.running&&!live.paused;
  $("#bcast").disabled=!canB; $("#bcastBtn").disabled=!canB;

  const tc=$("#tabs"); tc.innerHTML="";
  TABS.forEach(([k,label])=>{const b=el("button","tab"+(k===tab?" active":""),esc(label));
    b.onclick=()=>{tab=k;render();};tc.appendChild(b);});
}

async function ctl(action){
  try{
    if(action==="start"){const cfg=$("#startCfg")?.value;if(!cfg)return;
      busy="starting simulation… this can take a moment"; renderShell();
      await j("/sim/start",{method:"POST",headers:{'content-type':'application/json'},
        body:JSON.stringify({config:cfg})}); target=null; toast("simulation started");}
    else if(action==="stop"){busy="stopping simulation… finishing the current tick"; renderShell();
      await j("/sim/stop",{method:"POST"});toast("stopped");}
    else if(action==="pause"){await j("/pause",{method:"POST"});}
    else if(action==="resume"){await j("/resume",{method:"POST"});}
    else if(action==="checkpoint"){await j("/checkpoint",{method:"POST"});toast("checkpoint written");}
    else if(action==="resumeRun"){busy="resuming run…"; renderShell();
      await j(`/runs/${target}/resume`,{method:"POST"});toast("resuming run");}
    else if(action==="endRun"){await j(`/runs/${target}/end`,{method:"POST"});toast("run ended");}
    else if(action==="delete"){ if(!confirm("Delete this run and its data?"))return;
      await j(`/runs/${target}`,{method:"DELETE"}); target=null; toast("deleted");}
  }catch(e){ toast("error: "+e.message); }
  finally{ busy=null; }
  await loadState(); await loadRuns(); pickTarget(); renderShell(); await loadData(); render();
}

// ---------- charts (inline SVG) ----------
function cumulative(ticks,maxT){
  const out=new Array(maxT+1).fill(0);
  (ticks||[]).forEach(t=>{ if(t>=0&&t<=maxT) out[t]++; });
  for(let i=1;i<=maxT;i++) out[i]+=out[i-1];
  return out;
}
function lineChart(series,maxT){
  const W=320,H=150,pad=22; if(maxT<1)maxT=1;
  let ymax=1; series.forEach(s=>s.pts.forEach(v=>ymax=Math.max(ymax,v)));
  const X=i=>pad+(W-2*pad)*(i/maxT), Y=v=>H-pad-(H-2*pad)*(v/ymax);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  g+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2a313c"/>`;
  g+=`<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#2a313c"/>`;
  g+=`<text x="${pad-3}" y="${pad+4}" fill="#8b97a7" font-size="9" text-anchor="end">${ymax}</text>`;
  g+=`<text x="${W-pad}" y="${H-6}" fill="#8b97a7" font-size="9" text-anchor="end">t${maxT}</text>`;
  series.forEach(s=>{ const d=s.pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8"/>`; });
  g+=`</svg>`;
  const leg=series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<div>${g}<div class="legend">${leg}</div></div>`;
}
function barChart(items){
  const W=320,H=150,pad=22,n=items.length||1; let ymax=1;
  items.forEach(it=>ymax=Math.max(ymax,it.value));
  const bw=(W-2*pad)/n;
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  g+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2a313c"/>`;
  items.forEach((it,i)=>{ const h=(H-2*pad)*(it.value/ymax);
    const x=pad+i*bw+2, y=H-pad-h;
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" fill="${it.color||'#7aa2f7'}" rx="2"/>`;
    g+=`<text x="${(x+bw/2-2).toFixed(1)}" y="${H-pad+10}" fill="#8b97a7" font-size="8" text-anchor="middle">${esc(it.label)}</text>`;
    g+=`<text x="${(x+bw/2-2).toFixed(1)}" y="${(y-3).toFixed(1)}" fill="#d7dde6" font-size="9" text-anchor="middle">${it.value}</text>`;});
  g+=`</svg>`; return g;
}

// ---------- render ----------
function render(){
  renderShell();
  const v=$("#view");
  if(target===null){ v.innerHTML='<div class="empty">No run. Start a simulation, or pick a past run.</div>'; return; }
  if(data.error){ v.innerHTML=`<div class="empty">error loading run: ${esc(data.error)}</div>`; return; }
  ({overview:rOverview,beings:rBeings,self:rSelf,meaning:rMeaning,
    labor:rLabor,kinship:rKinship,continuity:rContinuity}[tab]||rOverview)(v);
}

function rOverview(v){
  const s=stats(), tl=data.timeline||{}, maxT=Math.max(s.tick,1);
  const founders=tl.founders||0;
  const births=cumulative(tl.births,maxT), deaths=cumulative(tl.deaths,maxT);
  const pop=births.map((b,i)=>founders+b-deaths[i]);
  const chips=[
    ["beings",s.beings],["alive",s.living],["died",s.dead],["tick",s.tick],
    ["self-revisions",s.self_revisions],["ideas",s.artifacts],["adopted",s.adoptions],
    ["projects done",s.projects_completed],["bonds",s.bonds],["groups",s.groups],
    ["born",s.births]];
  if(s.messages!=null) chips.push(["messages",s.messages]);

  const charts=[
    {h:"Population over time",b:lineChart([
      {name:"alive",color:"#7ee787",pts:pop},
      {name:"births",color:"#7aa2f7",pts:births},
      {name:"deaths",color:"#f7768e",pts:deaths}],maxT)},
    {h:"Becoming & culture over time",b:lineChart([
      {name:"self-revisions",color:"#c792ea",pts:cumulative(tl.self_revisions,maxT)},
      {name:"ideas voiced",color:"#56d4dd",pts:cumulative(tl.artifacts,maxT)},
      {name:"adoptions",color:"#e0a458",pts:cumulative(tl.adoptions,maxT)}],maxT)},
    {h:"Labor over time",b:lineChart([
      {name:"started",color:"#7aa2f7",pts:cumulative(tl.projects_started,maxT)},
      {name:"completed",color:"#7ee787",pts:cumulative(tl.projects_completed,maxT)}],maxT)},
    {h:"Bonds & collectives over time",b:lineChart([
      {name:"ties formed",color:"#c792ea",pts:cumulative(tl.bonds,maxT)},
      {name:"groups",color:"#e0a458",pts:cumulative(tl.groups,maxT)}],maxT)},
    {h:"Vitality of the living now",b:barChart(
      (data.agents||[]).filter(a=>a.alive).slice(0,16).map(a=>(
        {label:(a.name||a.id).slice(0,4),value:Math.round(a.vitality||0),
         color:(a.vitality||0)<25?"#f7768e":"#7ee787"})))},
    {h:"Ties by kind",b:barChart(Object.entries(
      (data.kinship?.relationships||[]).filter(r=>r.dissolved_tick==null)
        .reduce((m,r)=>{m[r.type]=(m[r.type]||0)+1;return m;},{}))
      .map(([k,val])=>({label:k.slice(0,5),value:val,color:"#7aa2f7"})))},
  ];

  v.innerHTML="";
  const top=el("div","grid"); top.style.gridTemplateColumns="1fr";
  const chipCard=el("div","card","<h3>State</h3>");
  const cw=el("div","chips");
  chips.forEach(([l,val])=>cw.appendChild(el("div","chip",`<b>${val==null?"–":val}</b><span>${l}</span>`)));
  chipCard.appendChild(cw); top.appendChild(chipCard);
  v.appendChild(top);

  const cg=el("div","grid charts"); cg.style.marginTop="12px";
  charts.forEach(c=>{const card=el("div","card",`<h3>${c.h}</h3>`);
    card.insertAdjacentHTML("beforeend",c.b);cg.appendChild(card);});
  v.appendChild(cg);

  const feeds=el("div","grid"); feeds.style.gridTemplateColumns="1fr 1fr";
  feeds.style.marginTop="12px";
  const msgs=el("div","card","<h3>Recent words</h3>");
  const mf=el("div","feed");
  (live.recent_messages||[]).forEach(m=>mf.appendChild(el("div",null,
    `<b>${esc(m.sender_name||m.sender_id)}</b> <span class="muted">&rarr; ${(m.recipient_names||[]).map(esc).join(', ')}</span>: ${esc(m.content)}`)));
  if(!(live.recent_messages||[]).length) mf.innerHTML='<div class="muted">— (only while live)</div>';
  msgs.appendChild(mf);
  const evs=el("div","card","<h3>Recent happenings</h3>");
  const ef=el("div","feed");
  (live.recent_events||[]).slice(0,40).forEach(e=>{
    const t=typeof e==="string"?e:(e.event_type||JSON.stringify(e));
    ef.appendChild(el("div","small",esc(String(t)).slice(0,180)));});
  if(!(live.recent_events||[]).length) ef.innerHTML='<div class="muted">— (only while live)</div>';
  evs.appendChild(ef);
  feeds.appendChild(msgs); feeds.appendChild(evs);
  v.appendChild(feeds);
}

function rBeings(v){
  const g=el("div","grid charts"); v.innerHTML=""; v.appendChild(g);
  (data.agents||[]).forEach(a=>{
    const sm=a.self_model||{}, vit=Math.max(0,Math.min(100,a.vitality||0));
    const c=el("div","card");
    c.innerHTML=`<div class="row"><b>${esc(a.name)}</b>
      <span class="${a.alive?'alive':'dead'}">${a.alive?'alive':'† dead'}</span></div>
      <div class="small muted">${esc(a.id)} · self v${a.self_model_version}
      ${a.parent_ids&&a.parent_ids.length?'· born of '+a.parent_ids.map(esc).join(', '):''}</div>
      <div class="small">vitality ${(a.vitality||0).toFixed(0)} · sustenance ${(a.sustenance||0).toFixed(0)}</div>
      <div class="bar"><span style="width:${vit}%;background:${vit<25?'var(--bad)':'var(--good)'}"></span></div>
      <div class="small" style="margin-top:8px">${sm.identity_narrative?esc(sm.identity_narrative):'<span class="muted">not yet authored</span>'}</div>`;
    const b=el("button","small","view becoming");b.style.marginTop="8px";
    b.onclick=()=>{selfAgent=a.id;tab="self";render();};
    c.appendChild(b); g.appendChild(c);
  });
  if(!(data.agents||[]).length) v.innerHTML='<div class="empty">no beings</div>';
}

async function rSelf(v){
  const ags=data.agents||[];
  if(!selfAgent&&ags.length) selfAgent=ags[0].id;
  const wrap=el("div","grid two"); const list=el("div","card scroll","<h3>Beings</h3>");
  ags.forEach(a=>{const it=el("div","row agent-item",
    `<span>${esc(a.name)} <span class="muted small">v${a.self_model_version}</span></span>
     <span class="${a.alive?'alive':'dead'} small">${a.alive?'':'†'}</span>`);
    it.onclick=()=>{selfAgent=a.id;rSelf(v);};list.appendChild(it);});
  const detail=el("div","card","<div class='muted'>loading…</div>");
  wrap.appendChild(list);wrap.appendChild(detail);v.innerHTML="";v.appendChild(wrap);
  if(!selfAgent){detail.innerHTML='<div class="empty">select a being</div>';return;}
  let d; try{ d=await j(`/runs/${target}/self/${selfAgent}`);}catch(e){
    detail.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return;}
  let h=`<h3>${esc(d.name)} — becoming</h3><div class="tl">`;
  (d.versions||[]).forEach(ver=>{const sm=ver.self_model||{};
    h+=`<div class="node"><div><b>v${ver.version}</b> <span class="muted small">tick ${ver.tick_no}</span></div>
      ${ver.diff?`<div class="diff">${esc(ver.diff)}</div>`:''}
      ${sm.identity_narrative?`<div class="small" style="margin-top:4px">${esc(sm.identity_narrative)}</div>`:''}
      ${sm.beliefs&&sm.beliefs.length?`<div class="small"><span class="key">beliefs:</span> ${sm.beliefs.map(esc).join('; ')}</div>`:''}
      ${sm.goals&&sm.goals.length?`<div class="small"><span class="key">goals:</span> ${sm.goals.map(esc).join('; ')}</div>`:''}
      ${sm.mortality_stance?`<div class="small"><span class="key">on ending:</span> ${esc(sm.mortality_stance)}</div>`:''}</div>`;});
  h+="</div>"; detail.innerHTML=(d.versions||[]).length?h:'<div class="empty">no self-model history</div>';
}

function rMeaning(v){
  const d=data.meaning||{}, adoptCount={};
  (d.adoptions||[]).forEach(a=>adoptCount[a.artifact_id]=(adoptCount[a.artifact_id]||0)+1);
  const c=el("div","card",`<h3>The Common World — ${(d.artifacts||[]).length} ideas voiced, ${(d.adoptions||[]).length} adopted</h3>`);
  (d.artifacts||[]).slice().reverse().forEach(a=>{const ad=adoptCount[a.id]||0;
    c.appendChild(el("div","row",
      `<div><span class="key">${esc(a.kind)}</span> <b>#${a.id}</b> ${esc(a.content)}
        <div class="muted small">by ${nm(a.author_id,d.names)} · tick ${a.tick_no}
        ${a.parent_artifact_id?'· remix of #'+a.parent_artifact_id:''}</div></div>
       <div class="small ${ad?'':'muted'}">${ad?('adopted ×'+ad):'—'}</div>`));});
  if(!(d.artifacts||[]).length) c.innerHTML+='<div class="empty">no ideas voiced yet</div>';
  v.innerHTML="";v.appendChild(c);
}

function rLabor(v){
  const projs=data.labor||[];
  const board=(title,list,color)=>{const c=el("div","card",`<h3>${title} — ${list.length}</h3>`);
    list.forEach(p=>{const pct=Math.min(100,100*(p.effort||0)/(p.target||1));
      const cont=Object.keys(p.contributors||{});
      c.appendChild(el("div","row",`<div><b>#${p.id}</b> ${esc(p.goal||'')}
        <div class="muted small">founder ${esc(p.founder_id||'?')} · ${cont.length} contributor(s)${p.output?' · '+esc(p.output):''}</div>
        <div class="bar"><span style="width:${pct}%;background:${color}"></span></div></div>
        <div class="small muted">${(p.effort||0).toFixed(0)}/${(p.target||0).toFixed(0)}</div>`));});
    if(!list.length)c.innerHTML+='<div class="empty">none</div>';return c;};
  const wrap=el("div","grid");wrap.style.gridTemplateColumns="1fr 1fr";
  wrap.appendChild(board("Work underway",projs.filter(p=>p.status==="active"),"var(--accent)"));
  wrap.appendChild(board("Completed",projs.filter(p=>p.status==="completed"),"var(--good)"));
  v.innerHTML="";v.appendChild(wrap);
}

function rKinship(v){
  const d=data.kinship||{}, rels=(d.relationships||[]).filter(r=>r.dissolved_tick==null);
  const tcol={friend:'var(--good)',ally:'var(--accent)',rival:'var(--bad)',
    mentor:'var(--cyan)',partner:'var(--mag)',kin:'var(--warn)'};
  const rc=el("div","card scroll",`<h3>Ties — ${rels.length}</h3>`);
  rels.sort((a,b)=>(b.strength||0)-(a.strength||0)).forEach(r=>rc.appendChild(el("div","row",
    `<span>${nm(r.observer_id,d.names)} <span class="muted">&rarr;</span> ${nm(r.subject_id,d.names)}</span>
     <span><span class="pill" style="border-color:${tcol[r.type]||'var(--line)'}">${esc(r.type)}</span>
     <span class="muted small">${(r.strength||0).toFixed(1)}</span></span>`)));
  if(!rels.length)rc.innerHTML+='<div class="empty">no ties yet</div>';
  const gc=el("div","card",`<h3>Collectives — ${(d.groups||[]).length}</h3>`);
  (d.groups||[]).forEach(g=>gc.appendChild(el("div","row",`<div><b>${esc(g.name)}</b>
    <div class="muted small">${esc(g.purpose||'')} · founder ${esc(g.founder_id||'')}</div></div>
    <div class="small">${(g.members||[]).length} members</div>`)));
  if(!(d.groups||[]).length)gc.innerHTML+='<div class="empty">no groups founded</div>';
  const wrap=el("div","grid");wrap.style.gridTemplateColumns="1fr 1fr";
  wrap.appendChild(rc);wrap.appendChild(gc);v.innerHTML="";v.appendChild(wrap);
}

function rContinuity(v){
  const d=data.continuity||{};
  const dc=el("div","card scroll",`<h3>In memoriam — ${(d.deaths||[]).length}</h3>`);
  (d.deaths||[]).forEach(x=>dc.appendChild(el("div","row",`<div><b>${nm(x.agent_id,d.names)}</b>
    <div class="muted small">died tick ${x.tick_no} · ${esc(x.cause)}</div>
    ${x.legacy_summary?`<div class="small">&ldquo;${esc(x.legacy_summary)}&rdquo;</div>`:''}</div>`)));
  if(!(d.deaths||[]).length)dc.innerHTML+='<div class="empty">none have died</div>';
  const lc=el("div","card",`<h3>Lineage — ${(d.lineage||[]).length} born</h3>`);
  (d.lineage||[]).forEach(x=>{let p=[];try{p=JSON.parse(x.parent_ids||"[]");}catch(e){}
    lc.appendChild(el("div","row",`<div><b>${nm(x.child_id,d.names)}</b>
      <div class="muted small">tick ${x.tick_no} · child of ${p.map(q=>nm(q,d.names)).join(' + ')}</div></div>`));});
  if(!(d.lineage||[]).length)lc.innerHTML+='<div class="empty">no successors</div>';
  const wrap=el("div","grid");wrap.style.gridTemplateColumns="1fr 1fr";
  wrap.appendChild(dc);wrap.appendChild(lc);v.innerHTML="";v.appendChild(wrap);
}

// ---------- wiring ----------
$("#runSel").onchange=async e=>{target=+e.target.value;selfAgent=null;
  await loadData();render();};
$("#refresh").onclick=async()=>{await loadState();await loadRuns();await loadData();render();toast("refreshed");};
$("#bcastBtn").onclick=async()=>{const t=$("#bcast").value.trim();if(!t)return;
  try{await j("/broadcast",{method:"POST",headers:{'content-type':'application/json'},
    body:JSON.stringify({message:t})});$("#bcast").value="";toast("broadcast queued");}
  catch(e){toast("error: "+e.message);}};
$("#bcast").addEventListener("keydown",e=>{if(e.key==="Enter")$("#bcastBtn").click();});

boot();
</script>
</body>
</html>
