name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run ruff check src/unimatrix tests
      - name: Calibrate the bundled recipes with every reference steward
        run: |
          uv run unimatrix calibrate --recipe standard-v2 --seeds 1,2
          uv run unimatrix calibrate --recipe hell-v1 --seeds 1,2,19
      - name: Verify release artifacts contain only required source files
        run: |
          mkdir -p config/models config/societies internal/codex runs explorer/data
          echo '{"api_key":"distribution-private-sentinel"}' > config/models/distribution-credentials.json
          echo '{"private":"distribution-private-sentinel"}' > config/societies/distribution.json
          echo 'distribution-private-sentinel' > explorer/data/index.xcdn
          echo 'distribution-private-sentinel' > src/unimatrix/web/static/distribution.gguf
          echo 'distribution-private-sentinel' > src/unimatrix/web/static/distribution.safetensors
          echo 'distribution-private-sentinel' > internal/codex/private-audit.md
          uv build
          UNIMATRIX_DIST_DIR=dist uv run pytest -q tests/test_release.py
      - name: Rebuild the wheel from the source distribution
        run: |
          uv build dist/*.tar.gz --wheel --out-dir "$RUNNER_TEMP/unimatrix-sdist-wheel"
          uv run python tests/tools/compare_release_wheels.py dist/*.whl "$RUNNER_TEMP"/unimatrix-sdist-wheel/*.whl
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/unimatrix-wheel-smoke" --python "${{ matrix.python }}"
          uv pip install --python "$RUNNER_TEMP/unimatrix-wheel-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/unimatrix-wheel-smoke/bin/python" tests/tools/wheel_smoke.py
