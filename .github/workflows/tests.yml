name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run python tests/fixtures/blueprint/reference/validate_bundle.py --schemas
      - run: uv run ruff check src/unimatrix tests --exclude tests/fixtures
