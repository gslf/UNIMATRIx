[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "unimatrix"
version = "4.0.0"
description = "Deterministic material worlds and social evaluation for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gioele Stefano Luca Fierro" }]
dependencies = [
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "lmstudio>=1.6.0b1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "hypothesis>=6.100", "ruff>=0.12"]

[project.scripts]
unimatrix = "unimatrix.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unimatrix = ["web/static/*", "actions/*.json", "benchmark/*.json", "benchmark/plans/*.json", "benchmark/presets/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905", "B007", "B023"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
