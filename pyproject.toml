[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unimatrix"
version = "1.0.1"
description = "Multi-agent sociological simulation with LLM-driven agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gioele Stefano Luca Fierro" }]
dependencies = [
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "rich>=13.7",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "chromadb>=0.4",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.5"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
unimatrix = "unimatrix.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
